<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pomodoro++ [Mini]</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body class="light-mode">
    <div class="popup-container">
        <div class="popup-header">
            <span>Pomodoro++</span>
            <button id="popup-close" title="Cerrar">✕</button>
        </div>
        <div class="popup-body">
            <p>Trabajo • Ciclo 1 de 4</p>
            <h2 id="popup-time">24:59</h2>
            <div class="popup-controls">
                <button title="Pausar">⏸️</button>
                <button title="Reiniciar">🔄</button>
                <button id="btn-expand-window" title="Restaurar ventana completa">🗖</button>
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        document.addEventListener('DOMContentLoaded', () => {
            // Sincronizar el tema activo de la aplicación al abrir el popup
            ipcRenderer.invoke('get-current-theme').then((mode) => {
                if (mode === 'dark') {
                    document.body.classList.add('dark-mode');
                    document.body.classList.remove('light-mode');
                } else {
                    document.body.classList.add('light-mode');
                    document.body.classList.remove('dark-mode');
                }
            }).catch(err => console.error('Error al sincronizar el tema:', err));

            // Sincronizar la sesión actual
            ipcRenderer.invoke('get-last-session').then((session) => {
                const bodyText = document.querySelector('.popup-body p');
                if (bodyText) {
                    bodyText.textContent = `${session.mode} • Ciclo ${session.lastCycle} de ${session.totalCycles}`;
                }
            }).catch(err => console.error('Error al cargar sesión en popup:', err));

            // Botón expandir / restaurar ventana
            const btnExpand = document.getElementById('btn-expand-window');
            if (btnExpand) {
                btnExpand.addEventListener('click', () => {
                    ipcRenderer.send('close-popup-window');
                });
            }

            // Botón cerrar popup
            const btnClose = document.getElementById('popup-close');
            if (btnClose) {
                btnClose.addEventListener('click', () => {
                    ipcRenderer.send('close-popup-window');
                });
            }
        });
    </script>
</body>
</html>
