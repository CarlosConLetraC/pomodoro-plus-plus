# ==========================================
# Configuración de Rutas de Despliegue
# ==========================================

# --- LINUX (Arch, CachyOS, Debian, Ubuntu, etc.) ---
LINUX_APP_DIR="$HOME/.local/share/pomodoro-plus-plus"
LINUX_CONFIG_DIR="$HOME/.config/pomodoro-plus-plus"
LINUX_BIN_DIR="$HOME/.local/bin"
LINUX_DIST_DIR="dist"

# --- WINDOWS ---
WIN_APP_DIR="C:/Program Files/Pomodoro Plus Plus"
WIN_CONFIG_DIR="$APPDATA/Pomodoro Plus Plus"
WIN_BIN_DIR="C:/Program Files/Pomodoro Plus Plus"
WIN_DIST_DIR="dist"

# --- MACOS ---
MACOS_APP_DIR="/Applications/Pomodoro Plus Plus.app"
MACOS_CONFIG_DIR="$HOME/Library/Application Support/Pomodoro Plus Plus"
MACOS_BIN_DIR="/usr/local/bin"
MACOS_DIST_DIR="dist"
